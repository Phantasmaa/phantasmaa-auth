<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambiar contraseña · Phantasma hub</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: #0e0e10;
  color: #f5f5f7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 32px 20px;
}
.shell { max-width: 720px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; }
.sub { color: #888; font-size: 14px; margin-bottom: 28px; }
.card {
  background: #14141a;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 18px;
}
.card h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
.card .meta { color: #888; font-size: 13px; margin-bottom: 18px; }
.row { display: flex; align-items: center; justify-content: space-between;
       padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.row:last-child { border-bottom: none; }
.label { color: #888; font-size: 13px; }
.value { color: #f5f5f7; font-size: 14px; }

.theme-grid { display: grid; grid-template-columns: repeat(5, 1fr);
              gap: 10px; margin-top: 10px; }
.theme {
  cursor: pointer; border-radius: 10px; height: 64px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: white;
  border: 2px solid transparent;
  transition: transform 150ms ease;
}
.theme:hover { transform: scale(1.05); }
.theme.active { border-color: #ffd54f; }
.theme[data-theme="midnight"] { background: linear-gradient(135deg, #0e0e10, #1a1a2e); }
.theme[data-theme="aurora"]   { background: linear-gradient(135deg, #fdfbfb, #ebedee); color: #555; }
.theme[data-theme="sunset"]   { background: linear-gradient(135deg, #ff7e5f, #feb47b); }
.theme[data-theme="forest"]   { background: linear-gradient(135deg, #134e5e, #71b280); }
.theme[data-theme="ocean"]    { background: linear-gradient(135deg, #2e3192, #1bffff); }

.color-picker { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.color-picker input[type=range] { flex: 1; }
.swatch {
  width: 48px; height: 48px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
}

.btn {
  display: inline-block; padding: 10px 16px;
  background: #ffd54f; color: #14141a;
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; text-decoration: none;
}
.btn-ghost {
  background: transparent; color: #ffd54f;
  border: 1px solid rgba(255,213,79,0.4);
}
.btn:hover { filter: brightness(1.08); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

.back { color: #888; text-decoration: none; font-size: 13px; }
.back:hover { color: #f5f5f7; }

#save-status { color: #4ade80; font-size: 13px; margin-left: 8px; opacity: 0; transition: opacity 200ms; }
#save-status.visible { opacity: 1; }
</style>
</head>
<body>
<main style="max-width:560px;margin:32px auto;padding:24px;font-family:system-ui;color:#f5f5f7;background:#14141a;border-radius:14px">
  <h1>Cambiar contraseña</h1>
  <p>Actualiza la contraseña de tu cuenta.</p>
  {% if error %}<p role="alert" style="color:#f87171">{{ error }}</p>{% endif %}
  <form method="post" action="/account/change-password">
    <input type="hidden" name="next" value="{{ next|e }}">
    <label for="password_actual">Contraseña actual</label><br>
    <input id="password_actual" name="password_actual" type="password" autocomplete="current-password" required><br><br>
    <label for="password_nueva">Nueva contraseña (mínimo 8 caracteres)</label><br>
    <input id="password_nueva" name="password_nueva" type="password" autocomplete="new-password" minlength="8" required><br><br>
    <label for="password_confirma">Confirmar nueva contraseña</label><br>
    <input id="password_confirma" name="password_confirma" type="password" autocomplete="new-password" minlength="8" required><br><br>
    <button type="submit">Guardar nueva contraseña</button>
  </form><p><a href="/account">Volver a mi cuenta</a></p>
</main>
</body>
</html>
